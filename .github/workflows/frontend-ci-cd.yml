name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/frontend-ci-cd.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/frontend-ci-cd.yml'

# Cancel previous runs on new pushes
concurrency:
  group: docker-build-client-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MAJOR_VERSION: 2
  MINOR_VERSION: 0
  PATCH_VERSION: ${{ github.run_number }}

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Run client ESLint
        run: cd client && npm run lint

  frontend-build:
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dojo-client
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }},enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }},enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ env.PATCH_VERSION }},enable={{is_default_branch}}
            type=sha,prefix=main-sha-,format=short,enable={{is_default_branch}}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./client
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max
