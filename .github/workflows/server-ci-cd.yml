name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'server-spring/**'
      - '.github/workflows/server-ci-cd.yml'
  pull_request:
    paths:
      - 'server-spring/**'
      - '.github/workflows/server-ci-cd.yml'

# Cancel previous runs on new pushes
concurrency:
  group: docker-build-server-spring-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MAJOR_VERSION: 1
  MINOR_VERSION: 0
  PATCH_VERSION: ${{ github.run_number }}
jobs:
  backend-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Checkstyle
        run: ./mvnw -B checkstyle:check
        working-directory: server-spring

      - name: Formatting
        run: ./mvnw -B spotless:check
        working-directory: server-spring

  backend-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Integration tests require a running Postgres service. Use the default credentials.
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: dojo
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d dojo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Test
        run: ./mvnw -B test
        working-directory: server-spring

  backend-build:
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dojo-server-spring
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }},enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }},enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ env.PATCH_VERSION }},enable={{is_default_branch}}
            type=sha,prefix=main-sha-,format=short,enable={{is_default_branch}}

      # Push only on main branch, otherwise just build
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./server-spring
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dojo-server-spring
          cache-to: type=gha,scope=dojo-server-spring,mode=max
