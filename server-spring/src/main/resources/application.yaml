spring:
  application:
    name: dojo-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dojo}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
server:
  port: 7777

# API Docs
springdoc:
  api-docs:
    path: /api/docs/openapi
  override-with-generic-response: false
scalar:
  path: /api/docs
  url: ${springdoc.api-docs.path}

# Health and metrics
management:
  endpoint:
    health:
      show-details: when_authorized