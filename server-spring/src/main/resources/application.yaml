spring:
  application:
    name: dojo-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dojo}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        # Serialise a Page as Spring's PagedModel. The default shape is explicitly unstable.
        serialization-mode: via-dto
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
server:
  port: 7777

# API Docs
springdoc:
  api-docs:
    path: /api/docs/openapi
  override-with-generic-response: false
scalar:
  path: /api/docs
  url: ${springdoc.api-docs.path}
  page-title: "Dojo API description"

# Health and metrics
management:
  endpoint:
    health:
      show-details: when_authorized

# Authentication
dojo:
  base-url: ${DOJO_BASE_URL:http://localhost:5173}
  auth:
    google-client-id: ${GOOGLE_OAUTH_CLIENTID:not-configured}
    google-client-secret: ${GOOGLE_OAUTH_CLIENTSECRET:not-configured}
    google-allowed-domain: ${GOOGLE_ALLOWED_DOMAIN:}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    api-token-ttl: ${API_TOKEN_TTL:365d}
    cookie-secure: ${COOKIE_SECURE:true}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:7777}
  slack:
    bot-token: ${SLACK_BOT_TOKEN:}
    notification-channel-id: ${SLACK_NOTIFICATION_CHANNEL_ID:}
  file-storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:ams3}
    bucket: ${STORAGE_BUCKET:dojo-dev}
    access-key-id: ${STORAGE_ACCESS_KEY_ID:dojo_key}
    access-key-secret: ${STORAGE_ACCESS_KEY_SECRET:dojo_secret}
    force-base-path-style: ${STORAGE_BASE_FORCE_PATH_STYLE:true}
