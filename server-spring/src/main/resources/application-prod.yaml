spring:
  application:
    name: dojo-server-prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

# API Docs
springdoc:
  api-docs:
    enabled: false
scalar:
  enabled: false

# Health and metrics
management:
  endpoint:
    health:
      show-details: when_authorized