spring:
  application:
    name: dojo-server-prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

# API Docs
springdoc:
  api-docs:
    enabled: false
scalar:
  enabled: false

# Health and metrics
management:
  endpoint:
    health:
      show-details: when_authorized

# Authentication
dojo:
  base-url: ${DOJO_BASE_URL}
  auth:
    google-client-id: ${GOOGLE_OAUTH_CLIENTID}
    google-client-secret: ${GOOGLE_OAUTH_CLIENTSECRET}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS}
  file-storage:
    endpoint: ${STORAGE_ENDPOINT}
    region: ${STORAGE_REGION}
    bucket: ${STORAGE_BUCKET}
    access-key-id: ${STORAGE_ACCESS_KEY_ID}
    access-key-secret: ${STORAGE_ACCESS_KEY_SECRET}
    force-base-path-style: false
